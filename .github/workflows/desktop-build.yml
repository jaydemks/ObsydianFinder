name: Desktop builds
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-keysyms1 libxcb-shape0 libxcb-icccm4 libnss3 libasound2t64 xvfb
      - name: Check 3D navigation and graphics fallback
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-test.txt
          python tests/ui_navigation.py
          python tests/ui_fallback.py
      - run: python -m PyInstaller --noconfirm Obsydian.spec
      - name: Check native application
        if: runner.os != 'Linux'
        run: python tests/smoke_desktop.py
      - name: Check native application on virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/smoke_desktop.py
      - name: Archive application
        shell: python
        run: |
          import shutil,sys,subprocess
          if sys.platform == 'darwin':
              subprocess.run(['ditto','-c','-k','--sequesterRsrc','--keepParent','dist/Obsydian Finder.app','Obsydian-macOS.zip'],check=True)
          elif sys.platform == 'win32':
              shutil.make_archive('Obsydian-Windows','zip','dist','Obsydian Finder')
          else:
              shutil.make_archive('Obsydian-Linux','gztar','dist','Obsydian Finder')
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Obsydian-${{ runner.os }}
          retention-days: 7
          compression-level: 0
          path: |
            Obsydian-*.zip
            Obsydian-*.tar.gz
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: Obsydian-*
          merge-multiple: true
      - name: Publish verified downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s Obsydian-Windows.zip
          test -s Obsydian-macOS.zip
          test -s Obsydian-Linux.tar.gz
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Obsydian Finder $GITHUB_REF_NAME" --notes "Native desktop builds verified on Windows, macOS and Linux."
          for file in Obsydian-*.zip Obsydian-*.tar.gz; do
            if [ -f "$file" ]; then gh release upload "$GITHUB_REF_NAME" "$file" --clobber; fi
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
